  </div>
  <div>
    <button class="control" id="shuffle">Перемішати</button>
    <button class="control secondary" id="restart">Почати спочатку</button>
  </div>
  <div id="status">Знайди правильне розташування всіх частинок ✨</div>
  <div class="hint">Кожен клік по частинці виділяє її. Другий клік міняє дві частинки місцями.</div>
</main>
<script>
const rows = 4, cols = 4;
const board = document.getElementById('board');
const done = document.getElementById('done');
const status = document.getElementById('status');
let order = [...Array(rows*cols).keys()];
let selected = null;

function shuffleArray(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  // Ensure the initial board is not already solved.
  if (a.every((v,i)=>v===i)) [a[0],a[1]]=[a[1],a[0]];
}

function render() {
  board.innerHTML = '';
  order.forEach((piece, slot) => {
    const tile = document.createElement('button');
    tile.className = 'tile' + (selected === slot ? ' selected' : '');
    const r = Math.floor(piece/cols), c = piece%cols;
    tile.style.backgroundPosition = `${c*100/(cols-1)}% ${r*100/(rows-1)}%`;
    tile.setAttribute('aria-label', `Частинка ${piece+1}`);
    tile.addEventListener('click', () => choose(slot));
    board.appendChild(tile);
  });
}

function choose(slot) {
  if (selected === null) {
    selected = slot;
  } else if (selected === slot) {
    selected = null;
  } else {
    [order[selected], order[slot]] = [order[slot], order[selected]];
    selected = null;
    checkSolved();
  }
  render();
}

function checkSolved() {
  const solved = order.every((v,i)=>v===i);
  if (solved) {
    board.style.display='none';
    done.classList.add('show');
    status.textContent='Ти зібрала пазл! ❤️';
  } else {
    board.style.display='grid';
    done.classList.remove('show');
    status.textContent='Ще трохи — у тебе все вийде ✨';
  }
}

function restart() {
  order = [...Array(rows*cols).keys()];
  shuffleArray(order);
  selected = null;
  board.style.display='grid';
  done.classList.remove('show');
  status.textContent='Знайди правильне розташування всіх частинок ✨';
  render();
}
document.getElementById('shuffle').addEventListener('click', restart);
document.getElementById('restart').addEventListener('click', restart);
restart();
</script>
